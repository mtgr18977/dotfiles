[colors]
base     = #1e1e2e
mantle   = #181825
surface0 = #313244
surface1 = #45475a
text     = #cdd6f4
subtext  = #a6adc8
overlay  = #6c7086
mauve    = #cba6f7
blue     = #89b4fa
green    = #a6e3a1
yellow   = #f9e2af
red      = #f38ba8
pink     = #f5c2e7

[bar/main]
monitor = ${env:MONITOR:DisplayPort-1}
width = 100%
height = 28
offset-x = 0
offset-y = 0
radius = 0
fixed-center = true
bottom = false

background = ${colors.base}
foreground = ${colors.text}

line-size = 0
border-size = 0

padding-left = 2
padding-right = 2
module-margin = 1

font-0 = "JetBrainsMono Nerd Font:size=9;2"

modules-left = launcher i3
modules-center = date weather
modules-right = cpu memory nightlight pulseaudio network tray power

cursor-click = pointer
enable-ipc = true

[module/launcher]
type = custom/text
format = "<label>"
format-foreground = ${colors.base}
format-background = ${colors.mauve}
format-padding = 1
label = "󰣇 "
click-left = rofi -show drun

[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = false
wrapping-scroll = false
fuzzy-match = true

label-mode-padding = 1
label-mode-foreground = ${colors.base}
label-mode-background = ${colors.mauve}

label-focused = %index%
label-focused-background = ${colors.mauve}
label-focused-foreground = ${colors.base}
label-focused-padding = 1
label-focused-margin = 1

label-unfocused = %index%
label-unfocused-background = ${colors.surface0}
label-unfocused-foreground = ${colors.subtext}
label-unfocused-padding = 1
label-unfocused-margin = 1

label-visible = %index%
label-visible-background = ${colors.surface1}
label-visible-foreground = ${colors.text}
label-visible-padding = 1
label-visible-margin = 1

label-urgent = %index%
label-urgent-background = ${colors.red}
label-urgent-foreground = ${colors.base}
label-urgent-padding = 1
label-urgent-margin = 1

[module/date]
type = internal/date
interval = 1

date = "%H:%M"
date-alt = "%A, %d de %B - %H:%M"

format = <label>
format-padding = 1
label =  %date%
label-foreground = ${colors.text}

[module/weather]
type = custom/script
exec = ~/.local/bin/weather.sh
interval = 1800
format = <label>
format-padding = 1
label = " %output%"
label-foreground = ${colors.subtext}
click-left = alacritty -e bash -c "curl wttr.in; echo; read -n1 -p 'Pressione qualquer tecla para fechar...'"

[module/nightlight]
type = custom/script
exec = ~/.local/bin/nightlight.sh status
interval = 5
click-left = ~/.local/bin/nightlight.sh toggle
format = <label>
format-padding = 1
label-foreground = ${colors.yellow}

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-padding = 1
label =  %percentage%%
label-foreground = ${colors.pink}

[module/memory]
type = internal/memory
interval = 3
format = <label>
format-padding = 1
label =  %percentage_used%%
label-foreground = ${colors.yellow}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
format-volume-padding = 1
format-muted = <label-muted>
format-muted-padding = 1

label-volume = %percentage%%
label-volume-foreground = ${colors.blue}

label-muted =  mudo
label-muted-foreground = ${colors.overlay}

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-foreground = ${colors.blue}

click-right = exec pavucontrol

[module/network]
type = internal/network
interface = ${env:NET_IFACE:enp0s31f6}
interval = 3

format-connected = <label-connected>
format-connected-padding = 1
label-connected =  %downspeed:9%
label-connected-foreground = ${colors.green}

format-disconnected = <label-disconnected>
format-disconnected-padding = 1
label-disconnected =  desconectado
label-disconnected-foreground = ${colors.red}

[module/tray]
type = internal/tray
tray-spacing = 8
format-margin = 2

[module/power]
type = custom/text
format = "<label>"
format-padding = 1
label = ""
label-foreground = ${colors.red}
click-left = ~/.local/bin/powermenu.sh

[settings]
screenchange-reload = true
pseudo-transparency = true
